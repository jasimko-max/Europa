<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Európa – štáty a hlavné mestá</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--sea:#d3ebf5;--ink:#16213e;--deep:#16276b;--ok:#25a35a;--bad:#e0453f;--nb:#e7e3d8;--font:"Bricolage Grotesque",system-ui,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--sea)}
main{display:grid;grid-template-columns:1fr 370px;height:100%}
.mapwrap{position:relative;min-width:0;min-height:0}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
#map.drag{cursor:grabbing}
.sea{fill:var(--sea)}
.nb{fill:var(--nb);stroke:#fff;stroke-width:.8;vector-effect:non-scaling-stroke}
.c{cursor:pointer}
.c path,.c .dot{stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke;transition:opacity .2s}
.c .dot{stroke:var(--ink);stroke-width:1.2}
.c:hover path{filter:brightness(1.1)}
#map.dim .c{opacity:.3}
#map.dim .c.hl,#map.dim .c.ok,#map.dim .c.bad{opacity:1}
.c.hl path{stroke:var(--ink);stroke-width:2.5}
.c.ok path,.c.ok .dot{fill:var(--ok);stroke:var(--ink);stroke-width:2}
.c.bad path,.c.bad .dot{fill:var(--bad);stroke:var(--ink);stroke-width:2}
#cap{fill:var(--bad);stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke;pointer-events:none;display:none}
#ring{fill:none;stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none;display:none}
.zoom{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border:0;border-radius:10px;background:#fff;color:var(--ink);font:700 20px var(--font);cursor:pointer;box-shadow:0 1px 4px #0003}
aside{background:var(--deep);color:#fff;padding:22px 20px;display:flex;flex-direction:column;gap:16px;overflow:auto}
h1{margin:0;font-size:38px;line-height:1;font-weight:800;letter-spacing:-.02em}
.sub{margin:6px 0 0;opacity:.75;font-size:15px}
.sub a{color:#ffd166;font-weight:600}
.modes{display:flex;flex-wrap:wrap;gap:6px}
.modes button{font:600 14px var(--font);padding:8px 12px;border-radius:99px;border:2px solid #ffffff55;background:transparent;color:#fff;cursor:pointer}
.modes button[aria-pressed=true]{background:#fff;color:var(--deep);border-color:#fff}
.reg{display:flex;align-items:center;gap:10px;font-size:14px}
.reg select{flex:1;font:600 15px var(--font);padding:8px 10px;border-radius:10px;border:0;background:#fff;color:var(--ink)}
.reg select:disabled{opacity:.5}
#card{background:#fff;color:var(--ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-height:240px}
.q{font-size:27px;line-height:1.15;font-weight:700}
.q b{color:var(--deep);font-weight:800}
.meta{display:flex;justify-content:space-between;font-size:14px;opacity:.7}
.bar{height:6px;border-radius:3px;background:#e3e8f5;overflow:hidden}
.bar i{display:block;height:100%;background:var(--deep);transition:width .3s}
.choices{display:grid;gap:8px}
.choices button{font:600 18px var(--font);text-align:left;padding:12px 14px;border:2px solid #cfd6ea;border-radius:12px;background:#fff;color:var(--ink);cursor:pointer}
.choices button:hover:not(:disabled){border-color:var(--deep)}
.choices button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.choices button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.msg{font-size:20px;font-weight:700}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.ans,.hint{margin:0;font-size:17px;line-height:1.35}
.hint{opacity:.65;font-size:15px}
.primary{font:700 17px var(--font);padding:12px 18px;border:0;border-radius:12px;background:var(--deep);color:#fff;cursor:pointer;margin-top:6px}
.primary.alt{background:#fff;color:var(--deep);border:2px solid var(--deep)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.score{font-size:68px;font-weight:800;line-height:1}
.score small{font-size:28px;opacity:.5}
ul.miss{margin:0;padding-left:18px;font-size:16px;line-height:1.5}
.nm{display:grid;gap:6px;font-size:14px;font-weight:600}
.nm input{font:600 18px var(--font);padding:10px 12px;border:2px solid #cfd6ea;border-radius:12px;color:var(--ink)}
.lbh{font-weight:700;margin-top:4px}
ol.lb{margin:0;padding:0;list-style:none;counter-reset:n;display:grid;gap:4px}
ol.lb li{counter-increment:n;display:flex;gap:6px;padding:6px 10px;border-radius:8px;background:#f1f4fb;font-size:16px}
ol.lb li::before{content:counter(n) ".";width:1.8em;opacity:.55}
ol.lb li span{flex:1}
ol.lb li.me{background:#ffe9a6}
button.link{background:none;border:0;color:var(--deep);text-decoration:underline;font:600 14px var(--font);cursor:pointer;align-self:flex-start;padding:0}
#sheet{display:none;color:#000;font-family:Arial,Helvetica,sans-serif}
.optl{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.optl input{width:20px;height:20px;accent-color:var(--deep)}
@media print{
 @page{size:A4;margin:12mm}
 html,body{height:auto;background:#fff}
 main{display:none}
 #sheet{display:block}
 .pg{page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .pg:last-child{page-break-after:auto}
}
.pg h2{margin:0 0 4px;font-size:15pt}
.pg .who{font-size:10pt;margin-bottom:6px}
.pg svg{width:100%;height:var(--mh);display:block;margin-bottom:6px}
.tbls{display:grid;gap:12px;align-items:start}
.pg table{border-collapse:collapse;width:100%;font-size:9.5pt}
.pg th{text-align:left;font-weight:700;border-bottom:1.5px solid #000;padding:2px 4px}
.pg td{border-bottom:1px solid #999;height:var(--rh);padding:0 4px}
.pg td.n{width:1.2cm;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 14px var(--font);padding:6px 11px;border-radius:99px;border:2px solid #cfd6ea;background:#fff;color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--deep);border-color:var(--deep);color:#fff}
ul.mm{margin:0;padding:0;list-style:none;font-size:17px;line-height:1.6}
.grp{flex-basis:100%;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-top:2px}
.flag{display:block;width:190px;max-width:100%;border:1px solid #cfd6ea;border-radius:6px;margin-bottom:10px}
#feat g[id^=L-]{display:none}
#map[data-layer=rivers] #L-rivers,#map[data-layer=mts] #L-mts,#map[data-layer=cities] #L-cities,#map[data-layer=water] #L-water{display:inline}
#map[data-on~=rivers] #L-rivers,#map[data-on~=mts] #L-mts,#map[data-on~=cities] #L-cities,#map[data-on~=caps] #L-caps,#map[data-on~=water] #L-water{display:inline}
.wt .vis{fill:rgba(31,120,209,.001);stroke:rgba(31,120,209,.4);stroke-width:1;stroke-dasharray:5 3;vector-effect:non-scaling-stroke;pointer-events:all}
.wt{cursor:pointer}.wt:hover .vis{fill:rgba(31,120,209,.16)}
.wt.hl .vis{fill:rgba(255,183,3,.38);stroke:var(--ink);stroke-dasharray:none;stroke-width:2}
.wt.ok .vis{fill:rgba(37,163,90,.42);stroke:var(--ok);stroke-dasharray:none;stroke-width:2}
.wt.bad .vis{fill:rgba(224,69,63,.42);stroke:var(--bad);stroke-dasharray:none;stroke-width:2}
.cn .vis{fill:none;stroke:#7a4a1c;stroke-width:3.4;stroke-linecap:round;vector-effect:non-scaling-stroke}
.cn .hit{fill:none;stroke:transparent;stroke-width:16;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:stroke}
.cn.hl .vis{stroke:#ffb703;stroke-width:6}.cn.ok .vis{stroke:var(--ok);stroke-width:6}.cn.bad .vis{stroke:var(--bad);stroke-width:6}
.st .vis{fill:#0a5a9c;stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke}
.cp .vis{fill:#222;stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke}
#map[data-layer]:not([data-layer=""]) .c{opacity:.5;pointer-events:none}
#map[data-layer]:not([data-layer=""]) .dot{display:none}
.f{cursor:pointer}
.rv .vis{fill:none;stroke:#1f78d1;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rv .hit{fill:none;stroke:transparent;stroke-width:16;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:stroke}
.mk .hit{fill:transparent}
.mt .vis{fill:#7a5a40;stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke}
.ct .vis{fill:#d63a34;stroke:#fff;stroke-width:1.2;vector-effect:non-scaling-stroke}
.rv.hl .vis{stroke:#ffb703;stroke-width:6}
.rv.ok .vis{stroke:var(--ok);stroke-width:6}
.rv.bad .vis{stroke:var(--bad);stroke-width:6}
.mk.hl .vis{fill:#ffb703}.mk.ok .vis{fill:var(--ok)}.mk.bad .vis{fill:var(--bad)}
aside>*{flex-shrink:0}
.lb{font-size:11px;font-weight:700;fill:#1b2a41;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none;font-family:var(--font)}
.lbc{fill:#6b6552;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
#labels{pointer-events:none}
.lyl{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}.lyl .optl{font-size:15px}
.rv .vis{filter:drop-shadow(0 0 1.3px #fff)}
.optl span{flex:1}
#lyinfo{border-bottom:1px solid #e3e8f5;padding-bottom:10px}#lyinfo:empty{display:none}
#plegend{display:none}
@media print{
 body.pm{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#fff}
 body.pm main{display:block;height:auto}
 body.pm aside,body.pm .zoom,body.pm #sheet{display:none}
 body.pm .mapwrap{height:17.5cm;border:1px solid #999}
 body.pm #plegend{display:block;color:#000;font-family:Arial,Helvetica,sans-serif;margin-top:8px}
 body.pm #plegend h2{font-size:14pt;margin:0 0 6px}
 body.pm .pl{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:10pt;align-items:center}
 body.pm .pl span{display:inline-flex;align-items:center;gap:6px}
}
.ph{margin:2px 0 4px}
.ph.load{display:flex;align-items:center;justify-content:center;height:130px;border-radius:12px;background:#eef1f8;color:#7c86a8;font-size:14px}
.ph img{display:block;width:100%;max-height:190px;object-fit:cover;border-radius:12px;background:#eef1f8}
.ph .cap{margin-top:4px;font-size:12px;opacity:.7}.ph .cap a{color:inherit}
details.sec{border-top:1px solid #e3e8f5;padding:8px 0}
details.sec>summary{font-weight:700;font-size:16px;cursor:pointer}
details.sec[open]>summary{margin-bottom:6px}
table.kv{border-collapse:collapse;width:100%;font-size:15px;line-height:1.4}
table.kv th{text-align:left;font-weight:600;color:#55618a;padding:3px 12px 3px 0;vertical-align:top;white-space:nowrap}
table.kv td{padding:3px 0}
ul.cl{margin:0;padding-left:18px;font-size:15px;line-height:1.45}ul.cl li{margin-bottom:4px}
.src{font-size:12px;opacity:.6;margin:6px 0 0}
.clues{display:grid;gap:8px}
.clue{background:#f1f4fb;border-radius:12px;padding:9px 12px;font-size:15px;line-height:1.4}
.clue b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#55618a;margin-bottom:2px}
.pts{font-size:14px;opacity:.75}
.pg .ins{font-size:10pt;margin:0 0 6px}
.pg .bank{border:1.5px dashed #555;border-radius:6px;padding:5px 8px;margin:4px 0 6px;font-size:9.5pt}
.pg .bank .bk{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:3px}
.pg ol.mk{columns:2;column-gap:20px;font-size:11pt;line-height:1.7;margin:8px 0 0;padding-left:22px}
.pg .gray{color:#555;font-size:9pt}
.pg .mt{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
.pg .mt td.ans{width:2.2cm;text-align:center;font-weight:700}
.pg ol.cd{font-size:10.5pt;line-height:1.9;padding-left:20px;margin:8px 0}
.pg .ln{display:inline-block;min-width:3.2cm;border-bottom:1px solid #000;padding:0 4px;font-weight:600;line-height:1.3}
.pg .ln.w{min-width:11cm}.pg .ln.s{min-width:1cm;text-align:center}
.pg table.memt{border-collapse:collapse;margin:4px 0;width:auto}.pg table.memt td{border:1px solid #999;padding:2px 10px;text-align:center;height:auto;font-size:9.5pt}
.pg .mcx{margin-right:14px}
.pg ul.tfl{margin:2px 0 0;padding-left:18px;line-height:1.6}
.pg svg.xws{display:block;margin:6px auto 8px}
.pg table.xw{border-collapse:collapse;margin:6px auto 8px;width:auto}
.pg table.xw td{width:var(--cs);height:var(--cs);padding:0;text-align:center;vertical-align:middle;font-size:11pt;font-weight:700;position:relative}
.pg table.xw td.cx{border:1.2px solid #000;background:#fff}
.pg table.xw td.ce{border:none;background:transparent}
.pg table.xw td i{position:absolute;left:1.5px;top:0;font-size:6.5pt;font-style:normal;font-weight:400;line-height:1}
.pg .xc{display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:9.5pt;line-height:1.35}
.pg .xc ol{margin:3px 0 0;padding-left:22px}.pg .xc li{margin-bottom:2px}
.pg table.cmp{table-layout:fixed;border-collapse:collapse;width:100%;font-size:9.5pt;margin:4px 0 6px}
.pg table.cmp th{border:1px solid #666;background:#f0f0f0;padding:3px 5px;text-align:center;font-weight:700;vertical-align:middle}
.pg table.cmp td{border:1px solid #666;padding:2px 5px;height:var(--rh);vertical-align:middle}
.pg table.cmp td.r{text-align:right}.pg table.cmp td.c{text-align:center;white-space:nowrap}.pg table.cmp td.n{width:.8cm;text-align:center;font-weight:700}
.foot{margin-top:auto;font-size:12px;opacity:.6;line-height:1.4}
:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
@media(max-width:820px){main{grid-template-columns:1fr;grid-template-rows:50vh 1fr}aside{padding:14px;gap:12px}h1{font-size:28px}.q{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const V0=D.vb;let vb=[...V0];

function zoom(f,cx,cy){const w=Math.min(V0[2]*1.2,Math.max(30,vb[2]*f)),r=w/vb[2];vb=[cx-(cx-vb[0])*r,cy-(cy-vb[1])*r,w,vb[3]*r];setVB()}
function zoomTo(x,y,w){const hh=w*V0[3]/V0[2];vb=[x-w/2,y-hh/2,w,hh];setVB()}

 const b=[p.hosp,p.priroda[1][1]].find(ok);if(b)L.push({h:L.length?'Hospodárstvo a podnebie':'Podnebie',t:b});
 const z=p.zname.filter(ok).slice(0,2);if(z.length)L.push({h:'Čím je známa',t:z.join(' ')});

 const row=n=>(p.zakl.find(r=>r[0]===n)||[n,'—'])[1];
 L.push({h:'Základné údaje',t:`Obyvatelia: ${row('Obyvatelia')}. Rozloha: ${row('Rozloha')}. Jazyk: ${row('Úradný jazyk')}. Mena: ${row('Mena')}.`});
 L.push({h:'Hlavné mesto a vlajka',t:`Hlavné mesto: <b style="display:inline;font-size:inherit;text-transform:none;letter-spacing:0;color:inherit">${c.cap}</b><img class="flag" style="width:90px;margin:8px 0 0" alt="Vlajka" onerror="this.style.display='none'" src="https://flagcdn.com/w320/${c.iso}.png">`});
 return L}

 const cl=CL.clues.slice(0,CL.shown).map((x,i)=>`<div class="clue"><b>Indícia ${i+1} · ${x.h}</b>${x.t}</div>`).join('');
 let ch='';if(CLCH){const o=sh([CL.k,...sh(pool().filter(x=>x!==CL.k&&!CL.wrong.includes(x))).slice(0,3)]);ch='<div class="choices">'+o.map(x=>`<button data-cg="${x}">${D.c[x].n}</button>`).join('')+'</div>'}

function lySym(l){

  case 'line':return S('<path d="M1 12C6 1 11 15 16 6S20 6 21 4" fill="none" stroke="#1f78d1" stroke-width="2.6" stroke-linecap="round"/>');
  case 'dot':return S(`<circle cx="11" cy="8" r="${l.r||4.5}" fill="${l.color}" stroke="#fff"/>`);
  case 'tri':return S(`<path d="M11 2L18 14H4Z" fill="${l.color}" stroke="#fff"/>`);
  case 'sq':return S(`<rect x="7" y="4" width="8" height="8" fill="${l.color}" stroke="#fff" transform="rotate(45 11 8)"/>`);
  case 'tower':return S(`<path d="M5 15V6h3V2h2v4h2V2h2v4h3v9Z" fill="${l.color}"/>`);
  case 'cave':return S(`<path d="M4 14A7 8 0 0 1 18 14Z" fill="${l.color}" stroke="#fff"/>`);
  case 'star':return S(`<path d="M11 1L13.4 6.3 19.2 6.9 14.8 10.8 16.1 16 11 13.4 5.9 16 7.2 10.8 2.8 6.9 8.6 6.3Z" fill="${l.color}"/>`);

 }}

function lyReflow(f){

  const w=t.dataset.n.length*6.6*f,hh=13*f;let bx,by;
  if(t.dataset.a==='m'){bx=x-w/2;by=y-hh/2}else{bx=x+5*f;by=y-hh*.75}

const PH={},PHI={};
const phItem=id=>FA[id]||PHI[id];
const phHolder=id=>{const it=phItem(id);return it&&it.wk?`<div id="phbox" class="ph load" data-id="${id}">Načítavam fotografiu…</div>`:''};
async function wikiFetch(params){const r=await fetch('https://sk.wikipedia.org/w/api.php?'+new URLSearchParams({format:'json',origin:'*',action:'query',...params}));return r.json()}
const phInfo=pg=>pg&&pg.thumbnail?{src:pg.thumbnail.source,file:pg.pageimage||'',title:pg.title}:null;
async function wikiPhoto(it){
 if(it.id in PH)return PH[it.id];
 let res=null;
 try{
  const base={prop:'pageimages',piprop:'thumbnail|name',pithumbsize:'700',redirects:'1'};
  let d=await wikiFetch({...base,titles:it.wk});
  res=phInfo(Object.values((d.query&&d.query.pages)||{})[0]);
  if(!res){
   for(const q of [it.wk,it.sq,it.n].filter(Boolean)){
    d=await wikiFetch({...base,generator:'search',gsrsearch:q,gsrnamespace:'0',gsrlimit:'4'});
    const pages=Object.values((d.query&&d.query.pages)||{}).sort((a,b)=>(a.index||9)-(b.index||9));
    res=pages.map(phInfo).find(Boolean)||null;if(res)break}}
 }catch(e){res=null}
 PH[it.id]=res;return res}
async function showPhoto(id){

 const p=await wikiPhoto(it),box=$('#phbox');
 if(!box||box.dataset.id!==id)return;

 box.className='ph';

const WTYPES={

function wsTypes(th){
 const t=[['blank',WTYPES.blank],['bank',WTYPES.bank],['mark',WTYPES.mark]];
 if(th.cap)t.push(['match',th.capLabel==='Krajské mesto'?'Spoj kraj s krajským mestom':'Spoj štát s hlavným mestom']);
 t.push(['cross','Krížovka']);

function pathBox(d){const n=(d.match(/-?\d+(?:\.\d+)?/g)||[]).map(Number);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(let i=0;i+1<n.length;i+=2){x0=Math.min(x0,n[i]);x1=Math.max(x1,n[i]);y0=Math.min(y0,n[i+1]);y1=Math.max(y1,n[i+1])}return[x0,y0,x1,y1]}
function wsView(th,items,ar){
 let b;
 if(th.kind==='poly'&&th.fit&&items.length){b=[1e9,1e9,-1e9,-1e9];items.forEach(it=>{const q=pathBox(it.d);b=[Math.min(b[0],q[0]),Math.min(b[1],q[1]),Math.max(b[2],q[2]),Math.max(b[3],q[3])]})}
 else b=[WSCFG.V0[0],WSCFG.V0[1],WSCFG.V0[0]+WSCFG.V0[2],WSCFG.V0[1]+WSCFG.V0[3]];
 let x0=b[0],y0=b[1],w=b[2]-b[0],h=b[3]-b[1];const pad=Math.max(w,h)*.05;x0-=pad;y0-=pad;w+=2*pad;h+=2*pad;
 if(w/h<ar){const nw=h*ar;x0-=(nw-w)/2;w=nw}else{const nh=w/ar;y0-=(nh-h)/2;h=nh}
 return{x0,y0,w,h}}
/* mapa: items = položky, mode: 'num' (číslované), 'none' (bez značiek); solved = farebné riešenie */
function wsMap(th,pool,items,{ar,numbered,solved}){
 const v=wsView(th,pool.length&&th.kind==='poly'?pool:items,ar),fs=Math.max(v.w,v.h)/55;

 s+=WSCFG.base(th,pool.map(x=>x.id),solved,items.map(x=>x.id));

  if(th.kind==='line'){s+=`<path d="${it.d}" fill="none" stroke="${solved?'#1f78d1':'#1f78d1'}" stroke-width="2.4" vector-effect="non-scaling-stroke"/>`+(n?`<text x="${it.lx}" y="${it.ly}" text-anchor="middle" style="${ts}">${n}</text>`:'')}

/* ===== Krížovka ===== */
const xwNorm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z]/g,'').toUpperCase();
function xwFits(cells,w,r0,c0,dir){
 const dr=dir==='d'?1:0,dc=dir==='a'?1:0,L=w.length;let inter=0;
 const at=(r,c)=>cells.get(r+','+c);
 if(at(r0-dr,c0-dc)||at(r0+L*dr,c0+L*dc))return -1;
 for(let k=0;k<L;k++){const r=r0+k*dr,c=c0+k*dc,cell=at(r,c);
  if(cell){if(cell.ch!==w[k]||cell.dirs.includes(dir))return -1;inter++}
  else{ if(dir==='a'){if(at(r-1,c)||at(r+1,c))return -1}else{if(at(r,c-1)||at(r,c+1))return -1} }}
 return inter}
function xwPlace(order){
 const cells=new Map(),placed=[];
 const put=(w,r0,c0,dir)=>{const dr=dir==='d'?1:0,dc=dir==='a'?1:0;
  for(let k=0;k<w.a.length;k++){const key=(r0+k*dr)+','+(c0+k*dc);const cell=cells.get(key);if(cell)cell.dirs.push(dir);else cells.set(key,{ch:w.a[k],dirs:[dir]})}
  placed.push({...w,r:r0,c:c0,dir})};
 put(order[0],0,0,'a');
 for(let i=1;i<order.length;i++){const w=order[i];let best=[],bs=0;
  for(const p of placed){
   for(let k=0;k<p.a.length;k++){const pr=p.r+(p.dir==='d'?k:0),pc=p.c+(p.dir==='a'?k:0),ch=p.a[k];
    const nd=p.dir==='a'?'d':'a';
    for(let j=0;j<w.a.length;j++){if(w.a[j]!==ch)continue;
     const r0=nd==='d'?pr-j:pr,c0=nd==='a'?pc-j:pc,sc=xwFits(cells,w.a,r0,c0,nd);
     if(sc<1)continue;if(sc>bs){bs=sc;best=[[r0,c0,nd]]}else if(sc===bs)best.push([r0,c0,nd])}}}
  if(best.length){const [r0,c0,nd]=best[Math.random()*best.length|0];put(w,r0,c0,nd)}}
 let r1=1e9,r2=-1e9,c1=1e9,c2=-1e9;
 cells.forEach((v,k)=>{const [r,c]=k.split(',').map(Number);r1=Math.min(r1,r);r2=Math.max(r2,r);c1=Math.min(c1,c);c2=Math.max(c2,c)});
 return{cells,placed:placed.map(p=>({...p,r:p.r-r1,c:p.c-c1})),rows:r2-r1+1,cols:c2-c1+1,r1,c1}}
function xwBuild(words,tries){
 let best=null;
 for(let t=0;t<tries;t++){
  const order=[...words].sort((p,q)=>(q.a.length-p.a.length)+(t?(Math.random()-.5)*6:0));
  const g=xwPlace(order),score=g.placed.length*10000-6*Math.max(g.rows,g.cols)**2-g.rows*g.cols;
  if(!best||score>best.score)best={...g,score}}
 return best}
function xwNumber(g){
 const starts=[...new Set(g.placed.map(p=>p.r+','+p.c))].map(k=>k.split(',').map(Number)).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
 const num={};starts.forEach((s,i)=>num[s.join(',')]=i+1);
 g.placed.forEach(p=>p.num=num[p.r+','+p.c]);return num}
const xwPattern=s=>String(s).split(/[\s\-]+/).filter(Boolean).map(x=>xwNorm(x).length).join(', ');
function xwHtml(g,num,sol){
 const grid={};g.placed.forEach(p=>{for(let k=0;k<p.a.length;k++){const r=p.r+(p.dir==='d'?k:0),c=p.c+(p.dir==='a'?k:0);grid[r+','+c]=p.a[k]}});
 const cs=Math.min(0.9,17.5/g.cols,12.5/g.rows);
 let s=`<svg class="xws" viewBox="-1 -1 ${g.cols*10+2} ${g.rows*10+2}" style="width:${((g.cols*10+2)*cs/10).toFixed(2)}cm;height:${((g.rows*10+2)*cs/10).toFixed(2)}cm">`;
 for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++){const k=r+','+c,ch=grid[k];if(!ch)continue;
  s+=`<rect x="${c*10}" y="${r*10}" width="10" height="10" fill="#fff" stroke="#000" stroke-width=".45"/>`;
  if(num[k])s+=`<text x="${c*10+.9}" y="${r*10+3.2}" font-size="2.8" font-family="Arial,sans-serif">${num[k]}</text>`;
  if(sol)s+=`<text x="${c*10+5}" y="${r*10+7.4}" text-anchor="middle" font-size="6.2" font-weight="700" font-family="Arial,sans-serif">${ch}</text>`}
 return s+'</svg>'}
function xwClues(g,sol){
 const li=p=>`<li value="${p.num}">${esc(p.clue)} <span class="gray">(${p.pat})</span>${sol?` <b>${esc(p.orig)}</b>`:''}</li>`;
 const A=g.placed.filter(p=>p.dir==='a').sort((a,b)=>a.num-b.num),Dn=g.placed.filter(p=>p.dir==='d').sort((a,b)=>a.num-b.num);
 return `<div class="xc"><div><b>Vodorovne</b><ol>${A.map(li).join('')}</ol></div><div><b>Zvisle</b><ol>${Dn.map(li).join('')}</ol></div></div>`}
const XW_GEN=new Set(['jaskyňa','jaskyne','hrad','zámok','kaštieľ','drevený','kostol','národný','park','národné','parky','kraj','a','v','pohorie','mesto','vrchy','starý','nový','pamiatky','rieka','ľadová','aragonitová','more','záliv','prieliv','prieplav','oceán']);
function xwShort(n){const w=n.split(/\s+/).filter(x=>!XW_GEN.has(x.toLowerCase()));const s=w.join(' ');return s.length>=4?s:n}
function wsCross(th,items,sol,cache){
 if(!cache.g){
  const map=th.xw||((it)=>({answer:xwShort(it.n),full:it.n,clue:it.i||''}));
  let words=items.map(it=>{const x=map(it,WS.xdir);return{orig:x.full||x.answer,a:xwNorm(x.answer),clue:x.clue,pat:xwPattern(x.answer)}})
   .filter(w=>w.a.length>=3&&w.a.length<=15&&w.clue&&!(th.xw?false:xwNorm(w.clue).includes(w.a.slice(0,Math.max(4,w.a.length-2)))));
  words=sh(words).slice(0,WS.n);
  const g=xwBuild(words,words.length>15?150:words.length>12?250:350);g.num=xwNumber(g);g.asked=words.length;cache.g=g}
 const g=cache.g,miss=g.asked-g.placed.length;
 return `<section class="pg" style="--mh:6cm">${wsPageHead(`Krížovka – ${WSCFG.name}: ${th.xwTitle||th.label}`,sol)}<p class="ins">Vyplň krížovku. Do každého políčka patrí jedno písmeno bez diakritiky.${miss>0?` (Do mriežky sa zmestilo ${g.placed.length} z ${g.asked} slov.)`:''}</p>${xwHtml(g,g.num,sol)}${xwClues(g,sol)}</section>`}

/* ===== Porovnávacia tabuľka štátov ===== */
const fmtN=n=>Math.round(n).toLocaleString('sk-SK');
const cmpOk=k=>{const p=D.c[k].pr;return p&&p.np&&p.na};
function wsComparePick(){
 const ok=K.filter(cmpOk);let sel=WS.pick.filter(cmpOk).slice(0,6);
 if(sel.length>=3)return sel;
 let from=pool().filter(cmpOk);if(from.length<WS.nc)from=ok;
 return sh(from).slice(0,WS.nc)}
function wsCompare(codes,sol){
 const filled=sol||WS.filled;
 const R=codes.map(k=>{const c=D.c[k],p=c.pr,row=n=>(p.zakl.find(r=>r[0]===n)||[n,''])[1];
  return{k,n:c.n,cap:c.cap,pop:p.np,area:p.na,dens:Math.round(p.np/p.na),cur:row('Mena'),eu:MEM.eu[1].includes(k),lx:c.lx,ly:c.ly,d:c.d}});
 const map=wsMap({id:'card',kind:'poly',fit:true},R.map(r=>({id:r.k,d:r.d})),R.map(r=>({id:r.k,lx:r.lx,ly:r.ly,micro:false})),{ar:3.1,numbered:true,solved:true});
 const euCell=r=>sol?(r.eu?'<b>✓ ÁNO</b>':'<b>✓ NIE</b>'):'ÁNO &nbsp; NIE';
 const body=R.map((r,i)=>`<tr><td class="n">${i+1}</td><td><b>${esc(r.n)}</b></td><td>${filled?esc(r.cap):''}</td><td class="r">${filled?fmtN(r.pop):''}</td><td class="r">${filled?fmtN(r.area):''}</td><td class="r">${sol?fmtN(r.dens):''}</td><td>${filled?esc(r.cur):''}</td><td class="c">${filled&&!sol?(r.eu?'✓ ÁNO':'✓ NIE'):euCell(r)}</td></tr>`).join('');
 const mx=(key,dir=1)=>R.reduce((a,b)=>b[key]*dir>a[key]*dir?b:a).n;
 const order=[...R].sort((a,b)=>a.pop-b.pop).map(r=>r.n);
 const ln=(v,w)=>`<span class="ln${w?' w':''}">${sol?esc(v):''}</span>`;
 return `<section class="pg" style="--mh:5.8cm;--rh:1.05cm">${wsPageHead('Porovnaj štáty',sol)}<p class="ins">${filled&&!sol?'Údaje v tabuľke sú vyplnené. Dopíš hustotu zaľudnenia (počet obyvateľov ÷ rozloha, zaokrúhli na celé číslo) a odpovedz na otázky.':'Dohľadaj údaje v aplikácii alebo v atlase, doplň tabuľku a odpovedz na otázky. Hustotu zaľudnenia vypočítaj (počet obyvateľov ÷ rozloha, zaokrúhli na celé číslo).'}</p>${map}`+
  `<table class="cmp"><colgroup><col style="width:.8cm"><col style="width:2.5cm"><col style="width:2.6cm"><col style="width:2.5cm"><col style="width:2.1cm"><col style="width:2.2cm"><col style="width:2.7cm"><col style="width:2cm"></colgroup><tr><th>č.</th><th>Štát</th><th>Hlavné mesto</th><th>Počet obyvateľov</th><th>Rozloha (km²)</th><th>Hustota (obyv./km²)</th><th>Mena</th><th>Člen EÚ</th></tr>${body}</table>`+
  `<ol class="cd"><li>Ktorý štát má najviac obyvateľov? ${ln(mx('pop'),1)}</li><li>Ktorý štát má najväčšiu rozlohu? ${ln(mx('area'),1)}</li><li>Ktorý štát je najhustejšie zaľudnený? ${ln(mx('dens'),1)}</li><li>Zoraď štáty od najmenej po najviac obyvateľov: ${ln(order.join(' < '),1)}</li><li>Koľko z týchto štátov je členom EÚ? ${ln(String(R.filter(r=>r.eu).length),0)}</li></ol></section>`}

setVB();intro();
</script>

<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Európa – štáty a hlavné mestá</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{--sea:#d3ebf5;--ink:#16213e;--deep:#16276b;--ok:#25a35a;--bad:#e0453f;--nb:#e7e3d8;--font:"Bricolage Grotesque",system-ui,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--sea)}
main{display:grid;grid-template-columns:1fr 370px;height:100%}
.mapwrap{position:relative;min-width:0;min-height:0}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
#map.drag{cursor:grabbing}
.sea{fill:var(--sea)}
.nb{fill:var(--nb);stroke:#fff;stroke-width:.8;vector-effect:non-scaling-stroke}
.c{cursor:pointer}
.c path,.c .dot{stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke;transition:opacity .2s}
.c .dot{stroke:var(--ink);stroke-width:1.2}
.c:hover path{filter:brightness(1.1)}
#map.dim .c{opacity:.3}
#map.dim .c.hl,#map.dim .c.ok,#map.dim .c.bad{opacity:1}
.c.hl path{stroke:var(--ink);stroke-width:2.5}
.c.ok path,.c.ok .dot{fill:var(--ok);stroke:var(--ink);stroke-width:2}
.c.bad path,.c.bad .dot{fill:var(--bad);stroke:var(--ink);stroke-width:2}
#cap{fill:var(--bad);stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke;pointer-events:none;display:none}
#ring{fill:none;stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none;display:none}
.zoom{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border:0;border-radius:10px;background:#fff;color:var(--ink);font:700 20px var(--font);cursor:pointer;box-shadow:0 1px 4px #0003}
aside{background:var(--deep);color:#fff;padding:22px 20px;display:flex;flex-direction:column;gap:16px;overflow:auto}
h1{margin:0;font-size:38px;line-height:1;font-weight:800;letter-spacing:-.02em}
.sub{margin:6px 0 0;opacity:.75;font-size:15px}
.modes{display:flex;flex-wrap:wrap;gap:6px}
.modes button{font:600 14px var(--font);padding:8px 12px;border-radius:99px;border:2px solid #ffffff55;background:transparent;color:#fff;cursor:pointer}
.modes button[aria-pressed=true]{background:#fff;color:var(--deep);border-color:#fff}
.reg{display:flex;align-items:center;gap:10px;font-size:14px}
.reg select{flex:1;font:600 15px var(--font);padding:8px 10px;border-radius:10px;border:0;background:#fff;color:var(--ink)}
.reg select:disabled{opacity:.5}
#card{background:#fff;color:var(--ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-height:240px}
.q{font-size:27px;line-height:1.15;font-weight:700}
.q b{color:var(--deep);font-weight:800}
.meta{display:flex;justify-content:space-between;font-size:14px;opacity:.7}
.bar{height:6px;border-radius:3px;background:#e3e8f5;overflow:hidden}
.bar i{display:block;height:100%;background:var(--deep);transition:width .3s}
.choices{display:grid;gap:8px}
.choices button{font:600 18px var(--font);text-align:left;padding:12px 14px;border:2px solid #cfd6ea;border-radius:12px;background:#fff;color:var(--ink);cursor:pointer}
.choices button:hover:not(:disabled){border-color:var(--deep)}
.choices button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.choices button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.msg{font-size:20px;font-weight:700}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.ans,.hint{margin:0;font-size:17px;line-height:1.35}
.hint{opacity:.65;font-size:15px}
.primary{font:700 17px var(--font);padding:12px 18px;border:0;border-radius:12px;background:var(--deep);color:#fff;cursor:pointer;margin-top:6px}
.primary.alt{background:#fff;color:var(--deep);border:2px solid var(--deep)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.score{font-size:68px;font-weight:800;line-height:1}
.score small{font-size:28px;opacity:.5}
ul.miss{margin:0;padding-left:18px;font-size:16px;line-height:1.5}
.nm{display:grid;gap:6px;font-size:14px;font-weight:600}
.nm input{font:600 18px var(--font);padding:10px 12px;border:2px solid #cfd6ea;border-radius:12px;color:var(--ink)}
.lbh{font-weight:700;margin-top:4px}
ol.lb{margin:0;padding:0;list-style:none;counter-reset:n;display:grid;gap:4px}
ol.lb li{counter-increment:n;display:flex;gap:6px;padding:6px 10px;border-radius:8px;background:#f1f4fb;font-size:16px}
ol.lb li::before{content:counter(n) ".";width:1.8em;opacity:.55}
ol.lb li span{flex:1}
ol.lb li.me{background:#ffe9a6}
button.link{background:none;border:0;color:var(--deep);text-decoration:underline;font:600 14px var(--font);cursor:pointer;align-self:flex-start;padding:0}
#sheet{display:none;color:#000;font-family:Arial,Helvetica,sans-serif}
.optl{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.optl input{width:20px;height:20px;accent-color:var(--deep)}
@media print{
 @page{size:A4;margin:12mm}
 html,body{height:auto;background:#fff}
 main{display:none}
 #sheet{display:block}
 .pg{page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .pg:last-child{page-break-after:auto}
}
.pg h2{margin:0 0 4px;font-size:15pt}
.pg .who{font-size:10pt;margin-bottom:6px}
.pg svg{width:100%;height:var(--mh);display:block;margin-bottom:6px}
.tbls{display:grid;gap:12px;align-items:start}
.pg table{border-collapse:collapse;width:100%;font-size:9.5pt}
.pg th{text-align:left;font-weight:700;border-bottom:1.5px solid #000;padding:2px 4px}
.pg td{border-bottom:1px solid #999;height:var(--rh);padding:0 4px}
.pg td.n{width:1.2cm;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 14px var(--font);padding:6px 11px;border-radius:99px;border:2px solid #cfd6ea;background:#fff;color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--deep);border-color:var(--deep);color:#fff}
ul.mm{margin:0;padding:0;list-style:none;font-size:17px;line-height:1.6}
.grp{flex-basis:100%;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-top:2px}
.flag{display:block;width:190px;max-width:100%;border:1px solid #cfd6ea;border-radius:6px;margin-bottom:10px}
#feat g[id^=L-]{display:none}
#map[data-layer=rivers] #L-rivers,#map[data-layer=mts] #L-mts,#map[data-layer=cities] #L-cities{display:inline}
#map[data-layer] .c{opacity:.5;pointer-events:none}
#map[data-layer] .dot{display:none}
.f{cursor:pointer}
.rv .vis{fill:none;stroke:#1f78d1;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rv .hit{fill:none;stroke:transparent;stroke-width:16;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:stroke}
.mk .hit{fill:transparent}
.mt .vis{fill:#7a5a40;stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke}
.ct .vis{fill:#d63a34;stroke:#fff;stroke-width:1.2;vector-effect:non-scaling-stroke}
.rv.hl .vis{stroke:#ffb703;stroke-width:6}
.rv.ok .vis{stroke:var(--ok);stroke-width:6}
.rv.bad .vis{stroke:var(--bad);stroke-width:6}
.mk.hl .vis{fill:#ffb703}.mk.ok .vis{fill:var(--ok)}.mk.bad .vis{fill:var(--bad)}
.foot{margin-top:auto;font-size:12px;opacity:.6;line-height:1.4}
:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
@media(max-width:820px){main{grid-template-columns:1fr;grid-template-rows:50vh 1fr}aside{padding:14px;gap:12px}h1{font-size:28px}.q{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <section class="mapwrap">
    <svg id="map" role="img" aria-label="Mapa Európy"></svg>
    <div class="zoom"><button id="zi" aria-label="Priblížiť">+</button><button id="zo" aria-label="Oddialiť">−</button><button id="zr" aria-label="Pôvodný pohľad">⌂</button></div>
  </section>
  <aside>
    <header><h1>Európa</h1><p class="sub">Štáty a hlavné mestá</p></header>

      <button data-m="name" aria-pressed="false">Pomenuj štát</button>
      <button data-m="cap" aria-pressed="false">Hlavné mesto</button>
      <button data-m="flag" aria-pressed="false">Vlajky</button>
      <span class="grp">Ďalšie témy</span>
      <button data-m="member" aria-pressed="false">Členstvo</button>
      <button data-m="rivers" aria-pressed="false">Rieky</button>
      <button data-m="mts" aria-pressed="false">Pohoria</button>
      <button data-m="cities" aria-pressed="false">Mestá</button>
      <span class="grp">Hra a tlač</span>
      <button data-m="comp" aria-pressed="false">Súťaž</button>
      <button data-m="print" aria-pressed="false">Pracovný list</button>
    </div>
    <label class="reg">Oblasť <select id="reg"></select></label>
    <div id="card" aria-live="polite"></div>
    <p class="foot">Mapové dáta: Natural Earth (verejná doména). Kosovo je zobrazené ako súčasť Srbska.</p>
  </aside>
</main>

function fEnd(){clear();resetView();const n=S.q.length;
 card.innerHTML=`<div class="meta"><span>Koniec kola</span></div><div class="score">${S.ok}<small> / ${n}</small></div><div class="msg">${S.ok===n?'Bezchybne!':S.ok>=n*.7?'Dobrá práca.':'Ešte si to precvičíme.'}</div>`+
 (S.bad.length?`<div>Zopakuj si:</div><ul class="miss">${S.bad.map(id=>`<li><b>${fName(FA[id])}</b></li>`).join('')}</ul>`:'')+
 `<div class="row"><button class="primary" id="fagain">Nové kolo</button><button class="primary alt" id="fback">Späť na mapu</button></div>`}
const sp=s=>s.split(' ');
const MEM={
 eu:['EÚ',sp('AUT BEL BGR HRV CYP CZE DNK EST FIN FRA DEU GRC HUN IRL ITA LVA LTU LUX MLT NLD POL PRT ROU SVK SVN ESP SWE'),'Európskej únie'],
 nato:['NATO',sp('ALB BEL BGR HRV CZE DNK EST FIN FRA DEU GRC HUN ISL ITA LVA LTU LUX MNE NLD MKD NOR POL PRT ROU SVK SVN ESP SWE TUR GBR'),'NATO'],
 euro:['Eurozóna',sp('AUT BEL BGR HRV CYP EST FIN FRA DEU GRC IRL ITA LVA LTU LUX MLT NLD PRT SVK SVN ESP'),'eurozóny'],
 sch:['Schengen',sp('AUT BEL BGR HRV CZE DNK EST FIN FRA DEU GRC HUN ISL ITA LVA LTU LUX MLT NLD NOR POL PRT ROU SVK SVN ESP SWE CHE LIE'),'Schengenu']};
S.l='eu';
function paint(l){svg.querySelectorAll('.c').forEach(g=>{const m=MEM[l][1].includes(g.dataset.k);g.querySelectorAll('path,.dot').forEach(e=>e.style.fill=m?'#2f55c9':'#e7e3d8')})}
function memCard(k){const L=MEM[S.l],chips=Object.entries(MEM).map(([id,v])=>`<button class="chip" data-l="${id}" aria-pressed="${id===S.l}">${v[0]}</button>`).join('');
 const info=k?`<div class="q"><b>${D.c[k].n}</b></div><ul class="mm">${Object.values(MEM).map(v=>`<li>${v[1].includes(k)?'✓':'✗'} ${v[0]}</li>`).join('')}</ul>`:
  `<p class="ans"><b>${L[0]}</b> – ${L[1].length} štátov na mape (modrou).</p><p class="hint">${L[1].map(x=>D.c[x].n).sort((a,b)=>a.localeCompare(b,'sk')).join(', ')}</p>`;
 card.innerHTML=`<div class="chips">${chips}</div>${info}<button class="primary" id="memquiz">Kvíz: je členom?</button><p class="hint">Stav k novembru 2026. Klikni na štát.</p>`}
function memIntro(k){clear();resetView();S.sub='';$('#reg').disabled=true;paint(S.l);if(k)G(k).classList.add('hl');memCard(k)}
function memQuiz(){clear();resetView();S.sub='quiz';$('#reg').disabled=false;S.q=sh(pool()).slice(0,10);S.qm=S.q.map(()=>Object.keys(MEM)[Math.random()*4|0]);S.i=0;S.ok=0;S.bad=[];memNext()}
function memNext(){clear();S.lock=false;const k=S.q[S.i],c=D.c[k];svg.classList.add('dim');G(k).classList.add('hl');if(c.m){place('ring',c);zoomTo(c.x,c.y,150)}
 card.innerHTML=`<div class="meta"><span>Otázka ${S.i+1} / ${S.q.length}</span><span>Správne: ${S.ok}</span></div><div class="bar"><i style="width:${S.i/S.q.length*100}%"></i></div><div class="q">Je <b>${c.n}</b> členom <b>${MEM[S.qm[S.i]][2]}</b>?</div><div class="choices"><button data-yn="1">Áno</button><button data-yn="0">Nie</button></div><div id="fb"></div>`}
function answerMem(yes){if(S.lock)return;S.lock=true;const k=S.q[S.i],c=D.c[k],l=S.qm[S.i],truth=MEM[l][1].includes(k),ok=yes===truth;
 svg.classList.add('dim');G(k).classList.add(ok?'ok':'bad');
 card.querySelectorAll('[data-yn]').forEach(b=>{b.disabled=true;const v=b.dataset.yn==='1';if(v===truth)b.classList.add('ok');else if(v===yes)b.classList.add('bad')});
 ok?S.ok++:S.bad.push({k,l,truth});
 $('#fb').innerHTML=`<div class="msg ${ok?'ok':'bad'}">${ok?'Správne!':'Nie.'}</div><p class="ans"><b>${c.n}</b> ${truth?'je':'nie je'} členom ${MEM[l][2]}.</p><button class="primary" id="memnext">${S.i+1<S.q.length?'Ďalej':'Výsledok'}</button>`;$('#memnext').focus()}
function memEnd(){clear();resetView();const n=S.q.length;
 card.innerHTML=`<div class="meta"><span>Koniec kola</span></div><div class="score">${S.ok}<small> / ${n}</small></div><div class="msg">${S.ok===n?'Bezchybne!':S.ok>=n*.7?'Dobrá práca.':'Ešte si to precvičíme.'}</div>`+
 (S.bad.length?`<div>Zopakuj si:</div><ul class="miss">${S.bad.map(x=>`<li><b>${D.c[x.k].n}</b> – ${x.truth?'je':'nie je'} členom ${MEM[x.l][2]}</li>`).join('')}</ul>`:'')+
 `<div class="row"><button class="primary" id="memagain">Nové kolo</button><button class="primary alt" id="memback">Späť na mapu</button></div>`}
function printIntro(){clear();resetView();card.innerHTML=`<div class="q">Pracovný list na tlač</div><p class="ans">Slepá mapa s očíslovanými štátmi a tabuľka, do ktorej žiaci dopíšu riešenie. Oblasť vyber vyššie.</p><label class="optl"><input type="checkbox" id="optcap" checked>Aj hlavné mesto</label><label class="optl"><input type="checkbox" id="optkey" checked>Učiteľský kľúč na 2. strane</label><button class="primary" id="doprint">Vytlačiť / uložiť ako PDF</button><p class="hint">Vo výbere tlačiarne zvoľ formát A4 na výšku. Číslovanie ide od západu na východ.</p>`}
function sheetMap(keys,solved,ar){
 let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 keys.forEach(k=>{const b=G(k).querySelector('path').getBBox();x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height)});
 let w=x1-x0,hh=y1-y0;const pad=Math.max(w,hh)*.05;x0-=pad;y0-=pad;w+=2*pad;hh+=2*pad;
 if(w/hh<ar){const nw=hh*ar;x0-=(nw-w)/2;w=nw}else{const nh=w/ar;y0-=(nh-hh)/2;hh=nh}
 const fs=Math.max(w,hh)/55;
 let s=`<svg viewBox="${x0} ${y0} ${w} ${hh}" preserveAspectRatio="xMidYMid meet"><rect x="${x0}" y="${y0}" width="${w}" height="${hh}" fill="#fff"/>`;
 D.nb.forEach(d=>s+=`<path d="${d}" fill="#eee" stroke="#bbb" stroke-width=".5" vector-effect="non-scaling-stroke"/>`);
 K.forEach(k=>{const c=D.c[k],inr=keys.includes(k);s+=`<path d="${c.d}" fill="${inr?(solved?c.col:'#fff'):'#e4e4e4'}" stroke="#444" stroke-width="${inr?.9:.5}" vector-effect="non-scaling-stroke"/>`});
 const ts=`font-size:${fs}px;font-weight:700;fill:#111;paint-order:stroke;stroke:#fff;stroke-width:${fs*.25}px;stroke-linejoin:round`;
 keys.forEach((k,i)=>{const c=D.c[k];
  if(c.m)s+=`<circle cx="${c.x}" cy="${c.y}" r="${fs*.28}" fill="#111"/><text x="${c.x+fs*.45}" y="${c.y-fs*.25}" style="${ts}">${i+1}</text>`;
  else s+=`<text x="${c.lx}" y="${c.ly}" text-anchor="middle" dominant-baseline="central" style="${ts}">${i+1}</text>`});
 return s+'</svg>'}
function sheetTable(keys,cap,solved){
 const rows=keys.map((k,i)=>`<tr><td class="n">${i+1}</td><td>${solved?D.c[k].n:''}</td>${cap?`<td>${solved?D.c[k].cap:''}</td>`:''}</tr>`);
 const half=rows.length>22?Math.ceil(rows.length/2):rows.length;
 const head=`<tr><th>č.</th><th>Štát</th>${cap?'<th>Hlavné mesto</th>':''}</tr>`,tb=r=>`<table>${head}${r.join('')}</table>`;
 return `<div class="tbls" style="grid-template-columns:${rows.length>half?'1fr 1fr':'1fr'}">${tb(rows.slice(0,half))}${rows.length>half?tb(rows.slice(half)):''}</div>`}
function buildSheet(){
 const keys=pool().sort((a,b)=>D.c[a].lx-D.c[b].lx),cap=$('#optcap').checked,key=$('#optkey').checked;
 const big=keys.length>22,page=sol=>`<section class="pg" style="--mh:${big?'11.5cm':'14.5cm'};--rh:${big?'.52cm':'.8cm'}"><h2>Slepá mapa Európy – ${REG[S.r][0]}${sol?' (riešenie)':''}</h2><div class="who">${sol?'Učiteľský kľúč':'Meno: ______________________ &nbsp; Trieda: ________ &nbsp; Dátum: ____________'}</div>${sheetMap(keys,sol,big?1.57:1.24)}${sheetTable(keys,cap,sol)}</section>`;
 $('#sheet').innerHTML=page(false)+(key?page(true):'')}
function compIntro(){clear();resetView();card.innerHTML=`<div class="q">Súťaž na 60 sekúnd</div><p class="ans">Odpovedaj na čo najviac otázok. Za každú správnu odpoveď je bod. Otázky sa striedajú: nájdi štát, štát podľa mesta, hlavné mesto, vlajka.</p><label class="nm">Meno<input id="nm" maxlength="20" autocomplete="off" placeholder="Tvoje meno"></label><button class="primary" id="go">Štart</button>${lbHtml()}<button class="link" id="clr">Vymazať rebríček</button>`;refreshLB()}
function compStart(){const n=($('#nm').value||'').trim()||'Hráč';S.name=n;S.cs={ok:0,bad:0,end:Date.now()+60000,last:null};S.live=true;compNext();S.tm=setInterval(tick,200)}
function tick(){const left=Math.max(0,S.cs.end-Date.now()),e=$('#tm'),b=$('#tb');if(e)e.textContent=Math.ceil(left/1000);if(b)b.style.width=left/600+'%';if(left<=0)compEnd()}
function compNext(){if(!S.live)return;const pl=pool().filter(k=>k!==S.cs.last),k=pl[Math.random()*pl.length|0];S.cs.last=k;S.qt=['find','findcap','cap','flag'][Math.random()*4|0];S.q=[k];S.i=0;next()}
function compEnd(){clearInterval(S.tm);clearTimeout(S.to);S.live=false;S.lock=true;clear();resetView();const c=S.cs,id=Date.now(),a=lbGet();a.push({id,n:S.name,s:c.ok,b:c.bad,r:S.r});lbSet(a.slice(-300));
 card.innerHTML=`<div class="meta"><span>Čas vypršal</span></div><div class="score">${c.ok}<small> bodov</small></div><p class="ans">${esc(S.name)} · chýb: ${c.bad}</p>${lbHtml(id)}<div class="row"><button class="primary" id="cagain">Ďalší hráč</button></div>`;postScore({id,n:S.name,s:c.ok,b:c.bad,r:S.r}).then(()=>refreshLB(id))}
const sh=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=()=>REG[S.r][1].filter(k=>D.c[k]);
const G=k=>svg.querySelector('[data-k="'+k+'"]');
function place(id,c){const e=$('#'+id);e.setAttribute('cx',c.x);e.setAttribute('cy',c.y);e.style.display='block'}
function clear(){svg.querySelectorAll('.c path,.c .dot').forEach(e=>e.style.fill='');svg.classList.remove('dim');svg.querySelectorAll('.c,.f').forEach(g=>g.classList.remove('hl','ok','bad'));$('#cap').style.display=$('#ring').style.display='none'}
function intro(){clear();card.innerHTML='<div class="q">Klikni na ľubovoľný štát.</div><p class="ans">Zobrazí sa jeho názov a hlavné mesto.</p><p class="hint">Mapu približuješ kolieskom myši alebo tlačidlami +/−, posúvaš ju ťahaním. Malé štáty (Monako, Vatikán, San Maríno…) sú označené bodkou.</p>'}
function start(){clearInterval(S.tm);clearTimeout(S.to);S.live=false;S.sub='';svg.dataset.layer=isF(S.m)?S.m:'';clear();resetView();$('#reg').disabled=S.m==='study'||S.m==='member';
 if(S.m==='member')return memIntro();
 if(isF(S.m)){$('#reg').disabled=true;return fIntro()}
 if(S.m==='study')return intro();
 if(S.m==='comp')return compIntro();
 if(S.m==='print')return printIntro();
 S.q=sh(pool()).slice(0,10);S.i=0;S.ok=0;S.bad=[];next()}
function next(){clear();S.lock=false;const k=S.q[S.i],c=D.c[k],m=TY();let q,ch='';
 if(m==='find')q=`Nájdi na mape: <b>${c.n}</b>`;
 if(m==='findcap')q=`Ktorý štát má hlavné mesto <b>${c.cap}</b>?`;
 if(m==='name'||m==='cap'||m==='flag'){if(m!=='flag'){svg.classList.add('dim');G(k).classList.add('hl');
  if(c.m){place('ring',c);zoomTo(c.x,c.y,150)}}
  q=m==='name'?'Ako sa volá tento štát?':m==='cap'?`Aké je hlavné mesto štátu <b>${c.n}</b>?`:`<img class="flag" alt="Vlajka" src="https://flagcdn.com/w320/${c.iso}.png">Ktorý štát má túto vlajku?`;
  const f=m==='cap'?'cap':'n',opts=sh([k,...sh(pool().filter(x=>x!==k)).slice(0,3)]);
  ch='<div class="choices">'+opts.map(o=>`<button data-o="${o}">${D.c[o][f]}</button>`).join('')+'</div>'}
 const left=S.m==='comp'?Math.max(0,S.cs.end-Date.now()):0;
 const head=S.m==='comp'?`<div class="meta"><span>Čas: <b id="tm">${Math.ceil(left/1000)}</b> s</span><span>Body: ${S.cs.ok}</span></div><div class="bar"><i id="tb" style="width:${left/600}%"></i></div>`:`<div class="meta"><span>Otázka ${S.i+1} / ${S.q.length}</span><span>Správne: ${S.ok}</span></div><div class="bar"><i style="width:${S.i/S.q.length*100}%"></i></div>`;
 card.innerHTML=`${head}<div class="q">${q}</div>${ch}<div id="fb"></div>`}
function answer(sel){if(S.lock)return;S.lock=true;
 const k=S.q[S.i],c=D.c[k],ok=sel===k,ty=TY(),click=ty==='find'||ty==='findcap';
 svg.classList.add('dim');G(k).classList.add('ok');if(!ok&&click)G(sel).classList.add('bad');
 place('cap',c);if(c.m&&click)place('ring',c);
 card.querySelectorAll('[data-o]').forEach(b=>{b.disabled=true;if(b.dataset.o===k)b.classList.add('ok');else if(b.dataset.o===sel)b.classList.add('bad')});
 if(S.m==='comp'){ok?S.cs.ok++:S.cs.bad++;$('#fb').innerHTML=`<div class="msg ${ok?'ok':'bad'}">${ok?'Správne!':(click?'Nie, to je '+D.c[sel].n+'.':'Nie.')}</div><p class="ans"><b>${c.n}</b> – hlavné mesto <b>${c.cap}</b></p>`;S.to=setTimeout(compNext,ok?500:1500);return}
 ok?S.ok++:S.bad.push(k);
 $('#fb').innerHTML=`<div class="msg ${ok?'ok':'bad'}">${ok?'Správne!':(click?'Nie, to je '+D.c[sel].n+'.':'Nie.')}</div><p class="ans"><b>${c.n}</b> – hlavné mesto <b>${c.cap}</b></p><button class="primary" id="next">${S.i+1<S.q.length?'Ďalej':'Výsledok'}</button>`;
 $('#next').focus()}
function end(){clear();resetView();const n=S.q.length;
 card.innerHTML=`<div class="meta"><span>Koniec kola</span></div><div class="score">${S.ok}<small> / ${n}</small></div><div class="msg">${S.ok===n?'Bezchybne!':S.ok>=n*.7?'Dobrá práca.':'Ešte si to precvičíme.'}</div>`+
 (S.bad.length?`<div>Zopakuj si:</div><ul class="miss">${S.bad.map(k=>`<li><b>${D.c[k].n}</b> – ${D.c[k].cap}</li>`).join('')}</ul>`:'')+
 `<div class="row"><button class="primary" id="again">Nové kolo</button>${S.bad.length?'<button class="primary alt" id="redo">Len chyby</button>':''}</div>`}
function mapClick(k,f){
 if(isF(S.m)){if(S.sub==='quiz'){if(S.qf[S.i]==='find'&&f&&FA[f]&&FA[f].t===S.m&&!S.lock)fAnswer(f)}else fExplore(f);return}
 if(S.m==='member'){if(S.sub!=='quiz')memIntro(k);return}
 if(S.m==='study'){clear();if(!k)return intro();const c=D.c[k];svg.classList.add('dim');G(k).classList.add('hl');place('cap',c);
  card.innerHTML=`<img class="flag" style="width:120px" alt="Vlajka" src="https://flagcdn.com/w320/${c.iso}.png"><div class="q"><b>${c.n}</b></div><p class="ans">Hlavné mesto: <b>${c.cap}</b></p><p class="hint">Klikni na ďalší štát.</p>`;return}
 if((TY()==='find'||TY()==='findcap')&&k&&!S.lock&&(S.m!=='comp'||S.live))answer(k)}
card.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.o)return answer(b.dataset.o);
 if(b.dataset.yn)return answerMem(b.dataset.yn==='1');
 if(b.dataset.fo)return fAnswer(b.dataset.fo);
 if(b.id==='fquiz'||b.id==='fagain')return fQuiz();
 if(b.id==='fnext'){S.i++;return S.i>=S.q.length?fEnd():fNext()}
 if(b.id==='fback')return fIntro();
 if(b.dataset.l){S.l=b.dataset.l;return memIntro()}
 if(b.id==='memquiz')return memQuiz();
 if(b.id==='memnext'){S.i++;return S.i>=S.q.length?memEnd():memNext()}
 if(b.id==='memagain')return memQuiz();
 if(b.id==='memback')return memIntro();
 if(b.id==='next'){S.i++;return S.i>=S.q.length?end():next()}
 if(b.id==='again')return start();
 if(b.id==='go')return compStart();
 if(b.id==='doprint'){buildSheet();setTimeout(()=>window.print(),80);return}
 if(b.id==='cagain')return compIntro();
 if(b.id==='clr'){if(API){const key=prompt('Admin kľúč na vymazanie spoločného rebríčka:');if(key)fetch(API+'/scores',{method:'DELETE',headers:{'X-Admin':key}}).then(()=>{lbSet([]);compIntro()});return}
  if(confirm('Vymazať celý rebríček na tomto zariadení?')){lbSet([]);compIntro()}return}
 if(b.id==='redo'){S.q=sh(S.bad);S.i=0;S.ok=0;S.bad=[];next()}});
card.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nm')compStart()});
$('#modes').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',x===b));S.m=b.dataset.m;start()});
$('#reg').onchange=e=>{S.r=e.target.value;start()};
setVB();intro();
</script>
